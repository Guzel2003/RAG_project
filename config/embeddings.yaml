run:
  name: rag_embeddings
  seed: 42

paths:
  input_jsonl: data/chunks/chunks.jsonl
  output_dir: data/embeddings
  json_filename: embeddings.json
  jsonl_filename: embeddings.jsonl
  manifest_filename: manifest.json

embedding:
  provider: local
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  batch_size: 64
  max_tokens: 8191
  normalize: true
  device: cpu

retry:
  max_attempts: 3
  delay_seconds: 2

validation:
  fail_on_validation_error: false
  check_dimensions: true
  check_nan: true
  check_duplicates: true

logging:
  level: INFO